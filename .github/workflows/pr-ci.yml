name: PR Deterministic Gate

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  deterministic-qa:
    name: deterministic-qa
    runs-on: ubuntu-24.04
    steps:
      - name: Configure deterministic Git line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout PR merge/head commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted bundle from base commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted-ref
          sparse-checkout: .ci/trusted-qa
          persist-credentials: false

      - name: Verify and extract trusted Gate 1 v2 bundle
        run: |
          EXPECTED="0c9254d17f5f5ae21b12f1015fc06e66df3323ceca85742eaf16a419515c30a8"
          PREV_BASE="31c2eb3ccbd6d53190c5ae3e17bb3aa84fa8354dc08120ac9e1f8b7fb99c8dbd"
          BASE_BUNDLE=".trusted-ref/.ci/trusted-qa/cabms-trusted-ci-gate1-v2.tar.gz"
          if [ -f "${BASE_BUNDLE}" ] && echo "${EXPECTED}  ${BASE_BUNDLE}" | sha256sum -c - >/dev/null 2>&1; then
            BUNDLE="${BASE_BUNDLE}"
          elif [ -f "${BASE_BUNDLE}" ] && echo "${PREV_BASE}  ${BASE_BUNDLE}" | sha256sum -c - >/dev/null 2>&1; then
            BUNDLE=".ci/trusted-qa/cabms-trusted-ci-gate1-v2.tar.gz"
          else
            echo "Trusted base bundle missing or unexpected digest."
            exit 1
          fi
          echo "${EXPECTED}  ${BUNDLE}" | sha256sum -c -
          mkdir -p /tmp/cabms-trusted-qa
          tar -xzf "${BUNDLE}" -C /tmp/cabms-trusted-qa
          rm -rf .trusted-ref

      - name: Setup Node 24.15.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.15.0"
          cache: "npm"

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install lockfile-controlled npm dependencies
        run: npm ci

      - name: Install pinned Python Playwright 1.50.0 and Chromium system dependencies
        run: |
          python -m pip install --no-cache-dir playwright==1.50.0
          python -m playwright install chromium
          python -m playwright install-deps chromium
          CHROME_BIN=$(python -c "from playwright.sync_api import sync_playwright; pw=sync_playwright().start(); print(pw.chromium.executable_path); pw.stop()")
          echo "CABMS_CHROME_PATH=${CHROME_BIN}" >> "$GITHUB_ENV"

      - name: Download and verify AQA v0.4.0 release archive
        run: |
          curl -fsSL -o /tmp/universal-adversarial-qa-v0.4.zip \
            https://github.com/chinedigitaldeveloper-ui/universal-adversarial-qa/releases/download/v0.4.0/universal-adversarial-qa-v0.4.zip
          echo "b8e535a15e5986ff3da0470147f1f024616c74daabf5344c22d501b40ebef0ce  /tmp/universal-adversarial-qa-v0.4.zip" | sha256sum -c -
          mkdir -p /tmp/aqa-runner
          unzip -q /tmp/universal-adversarial-qa-v0.4.zip -d /tmp/aqa-runner

      - name: Run 8-check Linux AQA gate
        env:
          CABMS_QA_TRUSTED_ROOT: /tmp/cabms-trusted-qa/trusted-check-inputs
          CABMS_COMPLIANCE_BROWSER_OUTPUT: ${{ runner.temp }}/cabms-browser-receipts
          CABMS_RUN_COMPLIANCE_BROWSER: "1"
          WRANGLER_SEND_METRICS: "false"
        run: |
          unset CABMS_PROPOSALS_DIR || true
          mkdir -p "${CABMS_COMPLIANCE_BROWSER_OUTPUT}"
          python /tmp/aqa-runner/universal-adversarial-qa/qa/aqa.py ci \
            --base "${{ github.event.pull_request.base.sha }}" \
            --policy /tmp/cabms-trusted-qa/policy.linux-ci.json \
            --policy-source worktree \
            --out "${{ runner.temp }}/aqa-report"

      - name: Run supplemental operational suites (F06 concurrency, 0014, Windows enrollment, integrated journey)
        env:
          CABMS_DISPOSABLE_D1_TEST: "1"
          WRANGLER_SEND_METRICS: "false"
        run: |
          node node_modules/tsx/dist/cli.mjs --test tests/workerd/f06_concurrency.test.ts
          node node_modules/tsx/dist/cli.mjs --test tests/workerd/c1_exact_0014.test.ts tests/workerd/windows_local_enrollment.test.ts
          node node_modules/tsx/dist/cli.mjs --test tests/workerd/wave1_2_client_journey.test.ts

      - name: Upload sanitized AQA summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-ci-summary-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/aqa-report/report.md
            ${{ runner.temp }}/aqa-report/report.json
          if-no-files-found: warn

      - name: Upload verified browser receipts
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-ci-receipts-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cabms-browser-receipts
          if-no-files-found: warn
